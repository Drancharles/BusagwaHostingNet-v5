<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUSAGWA HOSTING v4</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:15px}
.card{background:#111;border:1px solid #00ff88;border-radius:12px;padding:15px;margin:10px 0}
.btn{background:#00ff88;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;width:100%}
input{width:100%;padding:10px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<h2 style="color:#00ff88">BUSAGWA HOSTING v4</h2>
<div class="card">
<h3>Deploy Bot</h3>
<input id="repo" placeholder="https://github.com/user/repo">
<input id="token" placeholder="BOT_TOKEN (optional)">
<button class="btn" onclick="deploy()" id="btn">DEPLOY NOW</button>
<p id="status"></p>
</div>
<script>
async function deploy(){
 let b=document.getElementById('btn'),s=document.getElementById('status'),repo=document.getElementById('repo').value,token=document.getElementById('token').value;
 if(!repo){s.textContent='Paste GitHub URL';return}
 b.textContent='Deploying...';
 try{
  let r=await fetch('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo,envVars:{BOT_TOKEN:token}})});
  let d=await r.json();
  s.textContent=d.message||d.error;
  if(d.success) s.innerHTML+='<br><a href="'+d.dashboard+'" target="_blank" style="color:#00ff88">Open Dashboard</a>';
  b.textContent=d.success?'DONE ✅':'TRY AGAIN';
 }catch(e){s.textContent='Error: '+e.message;b.textContent='RETRY'}
}
</script>
</body>
</html>
